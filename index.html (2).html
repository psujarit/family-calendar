<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ปฏิทินนัดหมายครอบครัว</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b2d42;--bg:#fff4c9;--coral:#ff6b6b;--sky:#4cc9f0;--mint:#2ec4b6;--sun:#ffd23f;--grape:#9b5de5;--pink:#f15bb5;--orange:#ff9f1c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);background-image:radial-gradient(#ffd23f88 2.5px,transparent 2.5px);background-size:30px 30px;color:var(--ink);font-family:"Mali","Sarabun","Noto Sans Thai",system-ui,sans-serif;font-size:17px;line-height:1.55}
:focus-visible{outline:3px solid var(--grape);outline-offset:3px}
header{padding:30px 16px 6px;text-align:center}
h1{margin:0;font-size:clamp(2.1rem,8vw,3.6rem);line-height:1.2;font-weight:700;text-shadow:3px 3px 0 var(--ink)}
h1 span{display:inline-block}
.sub{margin:4px 0 0;font-weight:600}
.today{display:inline-block;margin:20px auto 0;padding:12px 22px;background:#fff;border:3px solid var(--ink);border-radius:20px;box-shadow:6px 6px 0 var(--coral);transform:rotate(-1.5deg);font-weight:700;font-size:1.15rem;max-width:92%}
.today small{display:block;font-weight:400;font-size:.95rem}
main{max-width:1060px;margin:0 auto;padding:22px 16px 40px}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:22px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip,.btn{font:inherit;color:var(--ink);cursor:pointer}
.chip{padding:6px 14px;background:#fff;border:3px solid var(--ink);border-radius:999px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--c,var(--ink));color:#fff;text-shadow:0 1px 0 #0004}
.chip[aria-pressed="true"][data-k="all"]{--c:var(--ink)}
.btn{padding:10px 20px;background:#e5405f;color:#fff;border:3px solid var(--ink);border-radius:999px;font-weight:700;box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.alt{background:#fff;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:26px 22px}
.card{position:relative;padding:16px 16px 14px;background:color-mix(in srgb,var(--c) 34%,#fff);border:3px solid var(--ink);border-radius:22px;box-shadow:6px 6px 0 var(--c)}
.card:nth-child(3n+1){transform:rotate(-1deg)}
.card:nth-child(3n+2){transform:rotate(.8deg)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.emo{font-size:2.1rem;line-height:1}
.badge{padding:2px 12px;background:#fff;border:2.5px solid var(--ink);border-radius:999px;font-weight:700;font-size:.9rem;white-space:nowrap}
.badge.now{background:var(--coral);color:#fff;animation:wig 1.6s ease-in-out infinite}
@keyframes wig{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.card h3{margin:8px 0 2px;font-size:1.25rem;line-height:1.3;overflow-wrap:anywhere}
.when{margin:0 0 8px;font-size:.95rem}
.who{display:flex;flex-wrap:wrap;gap:6px}
.who span{padding:0 10px;background:var(--m);border:2px solid var(--ink);border-radius:999px;font-size:.85rem;font-weight:600}
.note{margin:10px 0 0;padding:8px 10px;background:#fff9;border-radius:12px;font-size:.92rem}
.del{position:absolute;right:-8px;bottom:-12px;width:38px;height:38px;background:#fff;border:3px solid var(--ink);border-radius:50%;cursor:pointer;font-size:1rem}
.empty{text-align:center;padding:36px 10px;font-weight:600;font-size:1.1rem}
footer{max-width:760px;margin:0 auto;padding:0 16px 40px;text-align:center;font-size:.9rem}
footer code{background:#fff;border:2px solid var(--ink);border-radius:8px;padding:0 6px}
dialog{width:min(520px,92vw);padding:20px;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:24px;box-shadow:8px 8px 0 var(--ink);font-family:inherit}
dialog::backdrop{background:#2b2d4299}
dialog h2{margin:0 0 12px}
label.f{display:block;margin-bottom:12px;font-weight:600}
.f input,.f select,.f textarea{display:block;width:100%;margin-top:4px;padding:8px 10px;font:inherit;color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:12px}
.row{display:flex;gap:10px}.row .f{flex:1}
fieldset{margin:0 0 14px;padding:0;border:0}
legend{padding:0;margin-bottom:6px;font-weight:600}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick label{cursor:pointer}
.pick input{position:absolute;opacity:0}
.pick span{display:inline-block;padding:4px 12px;background:#fff;border:3px solid var(--ink);border-radius:999px;font-weight:600}
.pick input:checked+span{background:var(--m)}
.pick input:focus-visible+span{outline:3px solid var(--grape);outline-offset:2px}
.acts{display:flex;gap:10px;justify-content:flex-end}
.btns{display:flex;gap:10px}
.status{min-height:1.5em;margin:0 0 14px;text-align:center;font-weight:600}
.btn:disabled{opacity:.6}
@media (prefers-reduced-motion:reduce){.badge.now{animation:none}}
@media (max-width:520px){.card{transform:none!important}.row{flex-direction:column;gap:0}}
</style>
</head>
<body>
<header>
  <h1 id="fam" aria-label="ชื่อครอบครัว"></h1>
  <p class="sub">ปฏิทินนัดหมายของบ้านเรา 🎈</p>
  <div id="today" class="today" role="status"></div>
</header>

<main>
  <div class="bar">
    <div id="filters" class="chips" role="group" aria-label="กรองตามประเภทนัด"></div>
    <div class="btns"><button id="refresh" class="btn alt" type="button" aria-label="รีเฟรชนัด">🔄</button><button id="add" class="btn" type="button">➕ เพิ่มนัดใหม่</button></div>
  </div>
  <p id="status" class="status" role="status"></p>
  <section id="list" class="grid" aria-live="polite"></section>
  <p id="empty" class="empty" hidden>ยังไม่มีนัดในหมวดนี้ กด “เพิ่มนัดใหม่” ได้เลย 🌈</p>
</main>

<footer>
  <p>นัดทั้งหมดเก็บอยู่ใน Google Sheets ของบ้าน ใครมีรหัสครอบครัวก็เพิ่มและลบนัดจากหน้านี้ได้ และเปิดชีตแก้ตรงๆ ได้เช่นกัน</p>
</footer>

<dialog id="dlg">
  <form id="form">
    <h2>เพิ่มนัดใหม่ ✨</h2>
    <label class="f">ชื่อนัด<input name="title" required maxlength="60" placeholder="เช่น พาน้องไปหาหมอ"></label>
    <div class="row">
      <label class="f">วันที่<input type="date" name="date" required></label>
      <label class="f">เวลา<input type="time" name="time"></label>
    </div>
    <label class="f">ประเภท<select name="cat" id="catSel"></select></label>
    <fieldset><legend>ใครต้องไปบ้าง (ไม่เลือก = ทุกคน)</legend><div id="who" class="pick"></div></fieldset>
    <label class="f">โน้ตเพิ่มเติม<textarea name="note" rows="2" maxlength="140" placeholder="ของที่ต้องเตรียม สถานที่ ฯลฯ"></textarea></label>
    <label class="f">รหัสครอบครัว<input type="password" name="code" autocomplete="off" placeholder="ถามรหัสจากคนตั้งค่าเว็บ"></label>
    <div class="acts">
      <button type="button" class="btn alt" id="cancel">ยกเลิก</button>
      <button type="submit" class="btn">บันทึกนัด</button>
    </div>
  </form>
</dialog>

<script>
/* ===== แก้ตรงนี้ได้เลย ===== */
const FAMILY_NAME = "บ้านสุขใจ";

const MEMBERS = [
  { name: "พ่อ",   emoji: "👨", color: "#4cc9f0" },
  { name: "แม่",   emoji: "👩", color: "#f15bb5" },
  { name: "ลูก 1", emoji: "🧒", color: "#ffd23f" },
  { name: "ลูก 2", emoji: "👧", color: "#2ec4b6" },
  { name: "ปู่ย่า", emoji: "👵", color: "#c9a6f5" }
];

const CATS = {
  birthday: { label: "วันเกิด",      emoji: "🎂", color: "#f15bb5" },
  doctor:   { label: "หมอ/สุขภาพ",  emoji: "🏥", color: "#2ec4b6" },
  school:   { label: "โรงเรียน",     emoji: "🎒", color: "#4cc9f0" },
  trip:     { label: "เที่ยว",       emoji: "🌴", color: "#ff9f1c" },
  meal:     { label: "มื้อพิเศษ",    emoji: "🍽️", color: "#ffd23f" },
  other:    { label: "อื่นๆ",        emoji: "⭐", color: "#9b5de5" }
};

/* วาง URL ที่ได้จาก Google Apps Script ตรงนี้ (ดูขั้นตอนในคู่มือ) */
const API_URL = "https://script.google.com/macros/s/AKfycbys2M5GkTze-WFO-3LEK0AhlBMdpGN8RPFwBhrk-8MdAJ_904AYT03TBvsH2virz3wU/exec";
/* ========================== */

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const toISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const daysLeft = s => { const t = new Date(); t.setHours(0, 0, 0, 0); return Math.round((parse(s) - t) / 864e5); };
const memberOf = n => MEMBERS.find(m => m.name === n);

const CK = "family-cache-v1", CODEK = "family-code-v1";
const DEMO = !/^https:\/\//.test(API_URL);
let events = [], filter = "all";

(function () {
  const colors = ["#ff6b6b", "#4cc9f0", "#2ec4b6", "#9b5de5", "#f15bb5", "#ff9f1c"];
  const seg = window.Intl && Intl.Segmenter ? [...new Intl.Segmenter("th", { granularity: "grapheme" }).segment(FAMILY_NAME)].map(x => x.segment) : [FAMILY_NAME];
  $("#fam").innerHTML = seg.map((g, i) => `<span style="color:${colors[i % colors.length]}">${esc(g)}</span>`).join("");
})();

const store = {
  get: k => { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }
};
const setStatus = t => { $("#status").textContent = t; };
const setEvents = list => { events = list; store.set(CK, JSON.stringify(list)); };
const errText = err => err instanceof TypeError ? "เชื่อมต่อไม่ได้ ลองใหม่อีกครั้ง" : err.message;

function demoData() {
  const d = n => { const t = new Date(); t.setDate(t.getDate() + n); return toISO(t); };
  return [
    { id: "d1", title: "ตัวอย่าง: วันเกิดคุณยาย", date: d(0), time: "18:00", cat: "birthday", who: [], note: "ซื้อเค้กช็อกโกแลต" },
    { id: "d2", title: "ตัวอย่าง: ประชุมผู้ปกครอง", date: d(1), time: "16:00", cat: "school", who: ["แม่"], note: "" },
    { id: "d3", title: "ตัวอย่าง: ทริปเขาใหญ่", date: d(14), time: "07:00", cat: "trip", who: [], note: "เตรียมกระเป๋าคืนก่อนออกเดินทาง" }
  ];
}

async function call(body) {
  const r = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) });
  const t = await r.text();
  let j;
  try { j = JSON.parse(t); } catch (e) { throw new Error("สคริปต์ตอบกลับผิดรูปแบบ ตรวจว่า Deploy เป็น “ทุกคน” และใช้ URL ล่าสุด"); }
  if (!j.ok) { if (j.badCode) store.set(CODEK, ""); throw new Error(j.error || "ทำรายการไม่สำเร็จ"); }
  return j;
}

async function load() {
  if (DEMO) {
    if (!events.length) events = demoData();
    setStatus("โหมดตัวอย่าง: ยังไม่ได้เชื่อม Google Sheets นัดที่เพิ่มจะหายเมื่อรีเฟรชหน้า");
    render(); return;
  }
  setStatus("กำลังอัปเดตนัด…");
  try {
    const j = await (await fetch(API_URL)).json();
    if (!j.ok) throw new Error();
    setEvents(j.events); setStatus("");
  } catch (e) { setStatus("เชื่อมต่อ Google Sheets ไม่สำเร็จ กด 🔄 เพื่อลองอีกครั้ง"); }
  render();
}

function whoHtml(names) {
  if (!names.length || names.length >= MEMBERS.length) return `<span style="--m:#fff">👨‍👩‍👧‍👦 ทุกคน</span>`;
  return names.map(n => { const m = memberOf(n) || { emoji: "🙂", color: "#fff" }; return `<span style="--m:${m.color}">${m.emoji} ${esc(n)}</span>`; }).join("");
}

function render() {
  const all = events.slice().sort((a, b) => (a.date + (a.time || "")).localeCompare(b.date + (b.time || ""))).filter(e => daysLeft(e.date) >= 0);

  const todays = all.filter(e => daysLeft(e.date) === 0);
  $("#today").innerHTML = todays.length
    ? `วันนี้มี ${todays.length} นัด! 🎉<small>${todays.map(e => esc(e.title) + (e.time ? " " + esc(e.time) + " น." : "")).join(" · ")}</small>`
    : `วันนี้ไม่มีนัด พักผ่อนได้เต็มที่ 😴`;

  $("#filters").innerHTML = [`<button class="chip" data-k="all" aria-pressed="${filter === "all"}">ทั้งหมด</button>`]
    .concat(Object.entries(CATS).map(([k, c]) => `<button class="chip" data-k="${k}" style="--c:${c.color}" aria-pressed="${filter === k}">${c.emoji} ${c.label}</button>`)).join("");

  const shown = all.filter(e => filter === "all" || e.cat === filter);
  $("#empty").hidden = shown.length > 0;
  $("#list").innerHTML = shown.map(e => {
    const c = CATS[e.cat] || CATS.other, d = daysLeft(e.date);
    const label = d === 0 ? "วันนี้!" : d === 1 ? "พรุ่งนี้" : `อีก ${d} วัน`;
    const dateStr = parse(e.date).toLocaleDateString("th-TH", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
    return `<article class="card" style="--c:${c.color}">
      <div class="top"><span class="emo" aria-hidden="true">${c.emoji}</span><span class="badge${d === 0 ? " now" : ""}">${label}</span></div>
      <h3>${esc(e.title)}</h3>
      <p class="when">📅 ${dateStr}${e.time ? `<br>⏰ ${esc(e.time)} น.` : ""}</p>
      <div class="who">${whoHtml(e.who || [])}</div>
      ${e.note ? `<p class="note">${esc(e.note)}</p>` : ""}
      <button class="del" data-id="${esc(e.id)}" aria-label="ลบนัด ${esc(e.title)}">🗑️</button>
    </article>`;
  }).join("");
}

$("#filters").addEventListener("click", e => { const b = e.target.closest("[data-k]"); if (b) { filter = b.dataset.k; render(); } });

$("#list").addEventListener("click", async e => {
  const b = e.target.closest(".del");
  if (!b || !confirm("ลบนัดนี้ใช่ไหม? ทุกคนในบ้านจะไม่เห็นนัดนี้แล้ว")) return;
  if (DEMO) { events = events.filter(x => x.id !== b.dataset.id); render(); return; }
  const code = store.get(CODEK) || prompt("ใส่รหัสครอบครัว");
  if (!code) return;
  try {
    const j = await call({ action: "delete", code, id: b.dataset.id });
    store.set(CODEK, code); setEvents(j.events); render();
  } catch (err) { alert(errText(err)); }
});

/* ฟอร์มเพิ่มนัด */
const dlg = $("#dlg"), form = $("#form");
$("#catSel").innerHTML = Object.entries(CATS).map(([k, c]) => `<option value="${k}">${c.emoji} ${c.label}</option>`).join("");
$("#who").innerHTML = MEMBERS.map(m => `<label style="--m:${m.color}"><input type="checkbox" name="who" value="${esc(m.name)}"><span>${m.emoji} ${esc(m.name)}</span></label>`).join("");

$("#add").addEventListener("click", () => {
  form.reset(); form.date.value = toISO(new Date());
  form.code.value = store.get(CODEK); form.code.required = !DEMO;
  dlg.showModal(); form.title.focus();
});
$("#cancel").addEventListener("click", () => dlg.close());
$("#refresh").addEventListener("click", load);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });

form.addEventListener("submit", async ev => {
  ev.preventDefault();
  const f = new FormData(form), btn = form.querySelector("[type=submit]");
  const item = { title: f.get("title").trim(), date: f.get("date"), time: f.get("time"), cat: f.get("cat"), who: f.getAll("who"), note: f.get("note").trim() };
  if (DEMO) { events.push({ ...item, id: "d" + Date.now() }); filter = "all"; render(); dlg.close(); return; }
  btn.disabled = true; btn.textContent = "กำลังบันทึก…";
  try {
    const j = await call({ action: "add", code: f.get("code"), event: item });
    store.set(CODEK, f.get("code")); setEvents(j.events); filter = "all"; render(); dlg.close(); setStatus("บันทึกนัดแล้ว ✓");
  } catch (err) {
    console.error(err);
    if (err instanceof TypeError) { dlg.close(); setStatus("ส่งนัดไปแล้ว กำลังตรวจสอบจากชีต…"); await load(); }
    else alert(errText(err));
  }
  btn.disabled = false; btn.textContent = "บันทึกนัด";
});

if (!DEMO) { try { events = JSON.parse(store.get(CK) || "[]"); } catch (e) {} }
render();
load();
</script>
</body>
</html>
